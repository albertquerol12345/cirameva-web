<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<title>Encargos</title>
<style>
/* Encargos (7-nov-2026). Sin datos en el código: la hoja va en el #fragmento del enlace (no llega a ningún servidor ni al repo). */
:root{--fondo:#f6f6f3;--carta:#fff;--txt:#1d1d1b;--suave:#6b6b66;--verde:#1fa855;--linea:#e4e4df}
@media (prefers-color-scheme:dark){:root{--fondo:#121212;--carta:#1d1d1d;--txt:#f0f0ee;--suave:#a0a09a;--linea:#2c2c2c}}
*{box-sizing:border-box;margin:0}
body{background:var(--fondo);color:var(--txt);font:17px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:20px 16px 40px;max-width:560px;margin:0 auto}
h1{font-size:26px;margin-bottom:6px}
.nota{color:var(--suave);font-size:15px;margin-bottom:20px}
.carta{background:var(--carta);border:1px solid var(--linea);border-radius:16px;padding:16px;margin-bottom:14px}
.tarea{font-size:20px;font-weight:650;margin-bottom:4px}
.meta{color:var(--suave);font-size:15px}
.fila{display:flex;align-items:baseline;justify-content:space-between;margin:12px 0 14px}
.precio{font-size:30px;font-weight:750}
.extra{color:var(--suave);font-size:14px;text-align:right}
a.boton{display:block;text-align:center;background:var(--verde);color:#fff;text-decoration:none;font-weight:700;font-size:18px;padding:15px;border-radius:12px}
.vacio{text-align:center;color:var(--suave);padding:40px 10px}
.pie{color:var(--suave);font-size:13px;margin-top:24px;text-align:center}
.mapa{color:inherit}.hacer{margin:.6em 0 .8em 1.2em;padding:0;line-height:1.4}
</style></head><body>
<h1>Encargos</h1>
<p class="nota">Sin compromiso. Si uno no te va, no contestes: caduca solo. Precio cerrado por encargo; los gastos (billete, gasolina, compras) aparte con tique.</p>
<div id="lista"><p class="vacio">Cargando…</p></div>
<p class="pie" id="pie"></p>
<script>
(function(){
  addEventListener('hashchange',function(){location.reload()});
  var p=new URLSearchParams(location.hash.slice(1)), id=p.get('h')||location.hash.slice(1), prueba=p.get('prueba')==='1';
  var lista=document.getElementById('lista');
  if(!id){lista.innerHTML='<p class="vacio">Enlace incompleto.</p>';return}
  var tel='';
  function fecha(v){ // gviz: "Date(2026,10,14,14,0,0)" o texto "2026-11-14 14:00"
    if(v==null)return null; var m=String(v).match(/^Date\((\d+),(\d+),(\d+)(?:,(\d+),(\d+))?/);
    if(m)return new Date(+m[1],+m[2],+m[3],+(m[4]||23),+(m[5]||59));
    m=String(v).match(/(\d{4})-(\d{2})-(\d{2})(?:[ T](\d{1,2}):(\d{2}))?/);
    return m?new Date(+m[1],m[2]-1,+m[3],+(m[4]||23),+(m[5]||59)):null}
  function cuando(d){var dias=['dom','lun','mar','mié','jue','vie','sáb'];
    return 'antes del '+dias[d.getDay()]+' '+d.getDate()+'/'+(d.getMonth()+1)+' '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')}
  function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
  function filas(t){var cols=t.cols.map(function(c){return (c.label||c.id).trim().toLowerCase()});
    return t.rows.map(function(r){var o={};r.c.forEach(function(c,i){o[cols[i]]=c?(c.v!=null?c.v:c.f):null});return o})}
  function pinta(rs){
    var ahora=new Date();
    var ok=rs.filter(function(r){var e=String(r.estado||'').trim().toLowerCase(),d=fecha(r.antes_de);
      return (e==='abierto'||(prueba&&e==='ejemplo'))&&r.tarea&&+r.precio>0&&(!d||d>ahora)})  // sin precio fijado (regla de margen) no se publica
      .sort(function(a,b){return (fecha(a.antes_de)||0)-(fecha(b.antes_de)||0)});
    if(!ok.length){lista.innerHTML='<p class="vacio">Ahora mismo no hay encargos. Gracias por mirar.</p>';return}
    var mas=ok.length-3; ok=ok.slice(0,3);  // Hick: como mucho 3 a la vista
    lista.innerHTML=ok.map(function(r){var d=fecha(r.antes_de),pr=Math.round(+r.precio),h=+r.horas_est||1,eh=Math.round(pr/h);
      var txt='Me quedo «'+r.tarea+'» ('+pr+' €'+(d?', '+cuando(d):'')+')';
      var url='https://wa.me/'+tel+'?text='+encodeURIComponent(txt);
      var donde=r.donde?'<a class="mapa" href="https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(r.donde)+'" target="_blank" rel="noopener">📍 '+esc(r.donde)+'</a>':esc(r.zona);
      var hacer=String(r.que_hacer||'').split(/\n|;/).filter(Boolean).slice(0,3).map(function(x){return '<li>'+esc(x.trim())+'</li>'}).join('');
      return '<div class="carta"><div class="tarea">'+esc(r.tarea)+'</div><div class="meta">'+donde+(d?' · '+cuando(d):'')+'</div>'+
        '<div class="fila"><span class="precio">'+pr+' €</span><span class="extra">≈'+esc(h)+' h · '+eh+' €/h'+(/^s/i.test(r.gastos||'')?'<br>+ gastos con tique':'')+'</span></div>'+
        (hacer?'<ol class="hacer">'+hacer+'</ol>':'')+
        '<a class="boton" href="'+url+'" target="_blank" rel="noopener">Me lo quedo</a></div>'}).join('')+
      (mas>0?'<p class="vacio">+'+mas+' más cuando cojas alguno.</p>':'');
    document.getElementById('pie').textContent='Actualizado '+ahora.toLocaleTimeString('es-ES',{hour:'2-digit',minute:'2-digit'});
  }
  function jsonp(hoja,cb){var n='cb'+Math.random().toString(36).slice(2);window[n]=function(r){delete window[n];cb(r)};
    var s=document.createElement('script');
    s.src=(p.get('src')||'https://docs.google.com/spreadsheets/d/'+encodeURIComponent(id)+'/gviz/tq')+'?tqx=responseHandler:'+n+'&headers=1&sheet='+hoja;
    s.onerror=function(){lista.innerHTML='<p class="vacio">No se pudo cargar. Prueba en un rato.</p>'};document.head.appendChild(s)}
  jsonp('config',function(r){try{filas(r.table).forEach(function(o){if(String(o.clave).toLowerCase()==='telefono')tel=String(o.valor||'').replace(/\D/g,'')})}catch(e){}
    jsonp('Encargos',function(r){try{pinta(filas(r.table))}catch(e){lista.innerHTML='<p class="vacio">No se pudo leer la lista.</p>'}})});
})();
</script>
</body></html>
