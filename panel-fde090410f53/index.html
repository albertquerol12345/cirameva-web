<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Panel</title><meta name="robots" content="noindex,nofollow"><style>
:root{--f:#000;--t:#e6e6e6;--s:#8a8f98;--v:#22c55e;--a:#f59e0b;--r:#ef4444;--l:#2a2e37}
*{box-sizing:border-box;margin:0;padding:0}html{-webkit-text-size-adjust:none;text-size-adjust:none}
body{background:var(--f);color:var(--t);font:7px/1.15 ui-monospace,Menlo,Consolas,monospace;padding:1px}
#b{color:#000;font-weight:700;padding:1px 2px;background:var(--r)}#n,#x{display:inline}
.g{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 4px}.g>div,.u{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
h2{font-size:7px;color:var(--s);font-weight:400;border-top:1px solid var(--l)}
.verde{color:var(--v)}.ambar{color:var(--a)}.rojo{color:var(--r)}s{text-decoration:none;color:var(--s)}
#c{color:var(--s);white-space:normal;word-break:break-word}
#L input,#L button{font:16px system-ui}
</style></head><body>
<form id="L" style="margin:30vh auto;max-width:260px;text-align:center"><input id="pw" type="password" inputmode="numeric" autofocus placeholder="Contraseña" style="font-size:22px;padding:10px;width:100%;border-radius:10px;border:1px solid var(--l);background:var(--c);color:var(--t)"><button style="margin-top:10px;font-size:18px;padding:10px 18px;border-radius:10px;border:0;background:var(--v);color:#fff;width:100%">Entrar</button><div id="E" style="color:var(--r);margin-top:8px"></div></form><div id="A" style="display:none"><div id="b"><span id="n">…</span> <span id="x">cargando</span></div>
<div id="pv"></div><h2>POR TAREA</h2><div id="o" class="g"></div><div id="d"></div><h2>MÁQUINA hoy/techo</h2><div id="t" class="g"></div><div id="c"></div></div>
<script>
let D=null,ult=0;const $=i=>document.getElementById(i),e=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
let K=null;const U=['https://api.github.com/repos/albertquerol12345/cirameva-web/contents/estado.enc?ref=estado','https://raw.githubusercontent.com/albertquerol12345/cirameva-web/estado/estado.enc'];
const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function clave(p){const m=await crypto.subtle.importKey('raw',new TextEncoder().encode(p),'PBKDF2',false,['deriveKey']);
 return crypto.subtle.deriveKey({name:'PBKDF2',salt:new TextEncoder().encode('cirameva-panel-v1'),iterations:250000,hash:'SHA-256'},m,{name:'AES-GCM',length:256},false,['decrypt'])}
async function baja(){let mejor=null;for(const [i,u] of U.entries()){try{const r=await fetch(u+(i?'?'+Date.now():''),{cache:'no-store',headers:i?{}:{Accept:'application/vnd.github.raw'}});if(!r.ok)continue;const j=await r.json();if(!mejor||j.t>mejor.t)mejor=j}catch(_){}}return mejor}
async function trae(){if(!K)return;try{const j=await baja();if(!j)throw 0;const d=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(j.iv)},K,b64(j.ct));D=JSON.parse(new TextDecoder().decode(d));ult=Date.now()}catch(_){ }pinta()}
$('L').onsubmit=async ev=>{ev.preventDefault();$('E').textContent='Comprobando…';K=await clave($('pw').value);await trae();if(D){$('L').style.display='none';$('A').style.display='block';try{sessionStorage.p=$('pw').value}catch(_){}}else{K=null;$('E').textContent='Contraseña incorrecta o sin conexión'}};
try{if(sessionStorage.p){$('pw').value=sessionStorage.p;$('L').requestSubmit()}}catch(_){}
function pinta(){const b=$('b');if(!D){b.style.background='var(--r)';$('n').textContent='SIN DATOS';$('x').textContent='el panel no recibe estado';return}
 const viejo=Math.round(Date.now()/1000-D.generado),sinred=typeof ult=='number'?Math.round((Date.now()-ult)/1000):0,LIM=300;
 const O=D.obreros,v=O.filter(o=>o.estado=='verde').length,r=O.filter(o=>o.estado=='rojo').length,a=O.length-v-r,P=(c)=>'<b class="'+c+'">●</b>';
 if(viejo>LIM||sinred>LIM){b.style.background='var(--r)';$('n').textContent='PANEL PARADO';$('x').textContent='sin datos nuevos hace '+Math.round(Math.max(viejo,sinred)/60)+' min: no te fíes de lo de abajo'}
 else{b.style.background=v==0?'var(--r)':(r>0||!D.alimentador)?'var(--a)':'var(--v)';$('n').textContent=v+' TRABAJAN';
  $('x').textContent='· '+r+' rojos · '+a+' dudosos · obj 20 · cola '+D.cola+' · espera '+D.espera+(D.alimentador?'':' · ALIMENTADOR CAÍDO')+' · '+D.hora+' (hace '+(viejo<90?viejo+' s':Math.round(viejo/60)+' min')+')'}
 const MOD={Gemini:'Gemini 4 Neon',Codex:'GPT-6.2 Astra'},pr={};O.forEach(o=>{(pr[o.proveedor]=pr[o.proveedor]||[]).push(o)});
 $('pv').innerHTML=['Gemini','Codex'].concat(Object.keys(pr).filter(k=>!MOD[k])).map(k=>{const L=pr[k]||[],lv=L.filter(o=>o.estado=='verde').length,lr=L.filter(o=>o.estado=='rojo').length,la=L.length-lv-lr,mx=L.reduce((m,o)=>Math.max(m,o.minutos||0),0);
  return '<div class="u">'+P((lr||!lv)?'rojo':la?'ambar':'verde')+' '+e(k)+' <s>'+e(MOD[k]||'NV')+'</s> <b class="verde">'+lv+' verde</b> <b class="'+(lr?'rojo':'')+'">'+lr+' rojo</b>'+(la?' <b class="ambar">'+la+' dud</b>':'')+' <s>· más antiguo '+mx+' min</s></div>'}).join('');
 const g={};O.forEach(o=>{(g[o.tipo]=g[o.tipo]||[]).push(o)});
 $('o').innerHTML=Object.keys(g).sort().map(k=>{const L=g[k],lv=L.filter(o=>o.estado=='verde').length,lr=L.filter(o=>o.estado=='rojo').length,la=L.length-lv-lr,mx=L.reduce((m,o)=>Math.max(m,o.minutos||0),0);
  return '<div>'+P(lr?'rojo':la?'ambar':'verde')+L.length+' '+e(k.replace('cadena · ',''))+' <s>v'+lv+' r'+lr+(la?' d'+la:'')+' '+mx+'m</s></div>'}).join('')||'<div class="rojo">● ningún obrero abierto</div>';
 $('d').innerHTML=O.filter(o=>o.estado!='verde').map(o=>'<div class="u '+o.estado+'">● '+e(o.proveedor)+' '+e(o.nombre||o.tipo)+' '+o.minutos+'m quieto '+o.quieto+'s'+(o.agente?'':' sin proceso')+'</div>').join('');
 $('t').innerHTML=D.tabla.map(f=>'<div>'+e(f[0])+' <b class="'+(+f[1]>=+f[2]?'verde':+f[1]>=50?'ambar':'rojo')+'">'+f[1]+'</b><s>/'+f[2]+'</s></div>').join('');
 $('c').textContent=D.salud+' · '+D.caudal}
setInterval(trae,61000);setInterval(pinta,1000);
</script></body></html>
